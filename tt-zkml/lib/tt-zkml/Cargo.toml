[package]
name = "tt-zkml"
description = "zkML on Tenstorrent: runs the quantized network on the device (tt-zkml core, through the C ABI) and proves the execution trace"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tt-zkml-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
stwo.workspace = true
stwo-constraint-framework.workspace = true
num-traits.workspace = true
itertools.workspace = true

[features]
# Exposes the internals a test needs to play a malicious prover (rewrite the columns of a component, build unchecked proofs). Not for applications:
# it only widens what is visible, nothing changes in how proofs are made or verified.
forgery = []

[dev-dependencies]
# so that `cargo test` always has the `forgery` feature
tt-zkml = { path = ".", features = ["forgery"] }
# the tests edit proofs as JSON values and must write the fields back in their original order (a proof has one canonical encoding)
serde_json = { workspace = true, features = ["preserve_order"] }

[[test]]
name = "abi"
path = "tests/abi.rs"
harness = false

[[test]]
name = "proof"
path = "tests/proof.rs"
harness = false

[[test]]
name = "audit"
path = "tests/audit.rs"
required-features = ["forgery"]

[[test]]
name = "forgery_fuzz"
path = "tests/forgery_fuzz.rs"
required-features = ["forgery"]
