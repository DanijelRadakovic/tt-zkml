[workspace]
resolver = "2"
members = [
    "lib/tt-zkml-sys",   # raw bindings to the C ABI (abi/)
    "lib/tt-zkml",       # the library: safe API over the ABI, the AIR constraints, the prover
    "bin/tt-zkml",       # the command-line tool: load a model, run the forward pass, generate the output and the proof
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DanijelRadakovic/tt-zkml"

[workspace.dependencies]
tt-zkml-sys = { path = "lib/tt-zkml-sys" }
tt-zkml = { path = "lib/tt-zkml" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
# The proof side: the stwo Circle STARK prover and its constraint framework (the same revision as tt-zkml-core/benchmarks/stwo-cpu-simd).
# Needs nightly Rust (portable_simd), pinned in rust-toolchain.toml.
stwo = { git = "https://github.com/starkware-libs/proving", rev = "c87ea10db87a3de13c8633f5d44ede1df62299bc", default-features = false, features = ["std", "prover", "parallel"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/proving", rev = "c87ea10db87a3de13c8633f5d44ede1df62299bc", default-features = false, features = ["std", "prover", "parallel"] }
num-traits = "0.2"
itertools = "0.14"

# The proofs of the tests are slow in an unoptimized build (the SIMD prover): optimize the proof crates in the dev/test profile.
[profile.dev.package.stwo]
opt-level = 3
[profile.dev.package.stwo-constraint-framework]
opt-level = 3
[profile.dev.package.tt-zkml]
opt-level = 2
